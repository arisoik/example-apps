<!DOCTYPE HTML>
<html>
  <head>
    <title>Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="google" value="notranslate"/>
    <link href="vendor/fullcalendar/dist/skeleton.css" rel="stylesheet"/>
    <link href="vendor/fullcalendar/dist/themes/classic/theme.css" rel="stylesheet"/>
    <link href="vendor/fullcalendar/dist/themes/classic/palette.css" rel="stylesheet"/>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #calendar {
        max-width: 100%;
        height: 100%;
        padding: 8px;
        box-sizing: border-box;
      }

      @media (max-width: 650px) {
        .fc {
          font-size: .9em;
        }

        .fc-toolbar {
          flex-wrap: wrap;
        }

        .fc-toolbar-center {
          order: -1;
          width: 100%;
          justify-content: center;
        }
      }

      @media (max-width: 450px) {
        .fc-toolbar {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>

    <div id="calendar"></div>

    <script src="vendor/fullcalendar/dist/fullcalendar.global.js"></script>
    <script src="vendor/fullcalendar/dist/themes/classic/global.js"></script>
    <script src="vendor/fullcalendar/dist/locales-all/global.js"></script>
    <script src="vendor/rrule/dist/es5/rrule.min.js"></script>
    <script src="vendor/fullcalendar-rrule/global.js"></script>
    <script>

let href = window.location.href;
let url = new URL(href);
let filePath = url.searchParams.get("path");
let isWritable = url.searchParams.get("isPathWritable") == 'true';
let theme = url.searchParams.get("theme");

let calendarEl = document.getElementById('calendar');
let calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: navigator.language.toLowerCase(),
    headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
    },
    height: '100%',
    firstDay: 1,
    events: []
});
calendar.render();

console.log('Calendar app scaffold loaded. path=' + filePath + ' isWritable=' + isWritable + ' theme=' + theme);

    </script>
  </body>
</html>
